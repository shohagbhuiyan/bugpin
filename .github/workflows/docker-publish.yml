name: Build and Publish BugPin Docker Image

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # --------------------------------------------------
      # Checkout Community Edition source
      # Do NOT checkout the private bugpin-ee submodule.
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # --------------------------------------------------
      # Docker Buildx
      # --------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # --------------------------------------------------
      # Authenticate to GitHub Container Registry
      # No PAT or custom secret required.
      # --------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # Generate Docker tags and labels
      #
      # Produces:
      # ghcr.io/shohagbhuiyan/bugpin:latest
      # ghcr.io/shohagbhuiyan/bugpin:sha-xxxxxxx
      # --------------------------------------------------
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=BugPin
            org.opencontainers.image.description=Self-hosted visual bug reporting tool
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # --------------------------------------------------
      # Build and publish
      # --------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        run: |
          echo "Published:"
          echo "ghcr.io/${{ github.repository }}:latest"
